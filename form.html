<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>影視服事 - 填寫可服事時間</title>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0d1117;--surface:#161b22;--surface2:#21262d;--border:#30363d;
  --accent:#58a6ff;--green:#3fb950;--gold:#e3b341;--red:#f85149;
  --text:#c9d1d9;--muted:#8b949e;
}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans TC',system-ui,sans-serif;
  min-height:100vh;padding:0 0 60px;}
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');

.hdr{background:linear-gradient(135deg,#1f2937,#111827);padding:20px 20px 16px;
  border-bottom:1px solid var(--border);text-align:center;}
.hdr-icon{font-size:28px;margin-bottom:6px;}
.hdr-title{font-size:18px;font-weight:700;color:#e2e8f0;}
.hdr-sub{font-size:13px;color:var(--muted);margin-top:3px;}

.container{max-width:540px;margin:0 auto;padding:20px 16px;}

/* Step card */
.step{background:var(--surface);border:1px solid var(--border);border-radius:12px;
  padding:18px;margin-bottom:14px;}
.step-label{font-size:12px;color:var(--accent);font-weight:700;text-transform:uppercase;
  letter-spacing:.06em;margin-bottom:8px;}
.step-title{font-size:16px;font-weight:700;margin-bottom:14px;}

/* Name select */
select{width:100%;padding:12px 14px;background:var(--surface2);border:1px solid var(--border);
  border-radius:8px;color:var(--text);font-size:15px;font-family:inherit;outline:none;
  appearance:none;-webkit-appearance:none;cursor:pointer;}
select:focus{border-color:var(--accent);}
.select-wrap{position:relative;}
.select-wrap::after{content:'▾';position:absolute;right:14px;top:50%;transform:translateY(-50%);
  color:var(--muted);pointer-events:none;font-size:14px;}

/* Week section */
.week-hdr{font-size:13px;font-weight:700;color:var(--accent);padding:8px 0 4px;
  display:flex;align-items:center;gap:8px;}
.week-hdr::after{content:'';flex:1;height:1px;background:var(--border);}
.week-sep{margin:6px 0 10px;}

/* Checkbox item */
.date-item{display:flex;align-items:flex-start;gap:12px;padding:11px 12px;
  border-radius:8px;cursor:pointer;transition:background .12s;border:1px solid transparent;
  margin-bottom:6px;user-select:none;}
.date-item:hover{background:var(--surface2);}
.date-item.checked{background:rgba(248,81,73,.08);border-color:rgba(248,81,73,.25);}
.date-item input[type=checkbox]{display:none;}
.custom-cb{width:22px;height:22px;border-radius:6px;border:2px solid var(--border);
  background:var(--surface2);flex-shrink:0;margin-top:1px;transition:all .12s;
  display:flex;align-items:center;justify-content:center;}
.date-item.checked .custom-cb{background:var(--red);border-color:var(--red);}
.custom-cb::after{content:'';display:none;}
.date-item.checked .custom-cb::after{content:'✕';display:block;color:white;font-size:13px;font-weight:700;}
.date-info{flex:1;}
.date-svc{font-size:14px;font-weight:600;color:var(--text);margin-bottom:2px;}
.date-svc span{color:var(--accent);}
.date-svc.prayer span{color:#58a6ff;}
.date-svc.theone span{color:#bc8cff;}
.date-svc.sun span{color:#e3b341;}
.date-detail{font-size:12px;color:var(--muted);}
.date-item.checked .date-svc,.date-item.checked .date-detail{color:var(--red);}

/* All-avail toggle */
.all-avail-btn{width:100%;padding:11px;background:rgba(63,185,80,.08);
  border:1px solid rgba(63,185,80,.3);border-radius:8px;color:var(--green);
  font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;margin-bottom:14px;
  transition:all .15s;}
.all-avail-btn:hover{background:rgba(63,185,80,.15);}

/* Submit button */
.submit-btn{width:100%;padding:14px;background:var(--accent);color:#0d1117;border:none;
  border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;
  transition:all .15s;margin-top:6px;}
.submit-btn:hover{filter:brightness(1.1);}
.submit-btn:disabled{background:var(--border);color:var(--muted);cursor:not-allowed;filter:none;}

/* Success */
.success{display:none;text-align:center;padding:40px 20px;}
.success-icon{font-size:56px;margin-bottom:16px;}
.success-title{font-size:22px;font-weight:700;color:var(--green);margin-bottom:8px;}
.success-sub{font-size:14px;color:var(--muted);line-height:1.6;}
.resubmit-btn{margin-top:20px;padding:10px 20px;background:transparent;border:1px solid var(--border);
  border-radius:8px;color:var(--text);font-size:14px;cursor:pointer;font-family:inherit;}

/* Loading / error */
.loading{text-align:center;padding:40px;color:var(--muted);font-size:14px;}
.err-msg{background:rgba(248,81,73,.08);border:1px solid rgba(248,81,73,.3);
  border-radius:8px;padding:12px 14px;color:var(--red);font-size:13px;margin-bottom:12px;}

/* Month badge */
.month-badge{display:inline-block;background:rgba(88,166,255,.12);color:var(--accent);
  border-radius:6px;padding:3px 10px;font-size:13px;font-weight:700;margin-left:6px;}

/* Already submitted notice */
.already-note{background:rgba(63,185,80,.08);border:1px solid rgba(63,185,80,.3);
  border-radius:8px;padding:10px 14px;color:var(--green);font-size:13px;margin-bottom:12px;
  display:none;}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-icon">🎬</div>
  <div class="hdr-title">新店行道會影視部</div>
  <div class="hdr-sub" id="hdr-month">服事可用時間填寫</div>
</div>

<div id="loading-screen" class="container">
  <div class="loading">⏳ 載入中…</div>
</div>

<div id="form-screen" class="container" style="display:none">
  <!-- Step 1: name -->
  <div class="step">
    <div class="step-label">Step 1</div>
    <div class="step-title">請選擇你的名字</div>
    <div class="select-wrap">
      <select id="name-select">
        <option value="">── 請選擇 ──</option>
      </select>
    </div>
    <div class="already-note" id="already-note">
      ✓ 你已填寫過本月的資料，送出後會更新為最新選擇。
    </div>
  </div>

  <!-- Step 2: dates -->
  <div class="step">
    <div class="step-label">Step 2</div>
    <div class="step-title">請勾選「<span style="color:var(--red)">無法服事</span>」的時間</div>
    <div style="font-size:13px;color:var(--muted);margin-bottom:14px">
      打勾 = 那天我無法參與服事。沒有打勾 = 可以參與。
    </div>
    <button class="all-avail-btn" onclick="clearAllChecks()">
      ✅ 我這個月全部都可以（清除所有勾選）
    </button>
    <div id="date-list"></div>
  </div>

  <div id="err-msg" class="err-msg" style="display:none"></div>
  <button class="submit-btn" id="submit-btn" onclick="submitForm()">送出</button>
  <div style="font-size:12px;color:var(--muted);text-align:center;margin-top:10px">
    送出後可以重新填寫以修改
  </div>
</div>

<div id="success-screen" class="container success">
  <div class="success-icon">🙏</div>
  <div class="success-title">已送出！感謝你</div>
  <div class="success-sub" id="success-detail">你的可服事時間已記錄，感謝你的配合！</div>
  <button class="resubmit-btn" onclick="showForm()">重新填寫</button>
</div>

<script>
// ══ Firebase 設定（與後台相同） ══
const FIREBASE_CONFIG = {
  apiKey:            "AIzaSyBESRqa_nKU0UaESlkxuxCPlnM0y61yZZ0",
  authDomain:        "topchurch-scheduler.firebaseapp.com",
  databaseURL:       "https://topchurch-scheduler-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:         "topchurch-scheduler",
  storageBucket:     "topchurch-scheduler.firebasestorage.app",
  messagingSenderId: "130468282879",
  appId:             "1:130468282879:web:000879583cb9333300e7ca"
};
firebase.initializeApp(FIREBASE_CONFIG);
const db = firebase.database();

// ══ 月份（從 URL 參數或當前月份） ══
const params = new URLSearchParams(window.location.search);
const mParam = params.get('m'); // e.g. '2026-06'
let year, month;
if (mParam && /^\d{4}-\d{2}$/.test(mParam)) {
  year  = parseInt(mParam.split('-')[0]);
  month = parseInt(mParam.split('-')[1]);
} else {
  const now = new Date();
  year  = now.getFullYear();
  month = now.getMonth() + 1;
}

function pad(n){ return String(n).padStart(2,'0'); }
function fmtDate(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function mmdd(d){ return `${d.getMonth()+1}/${d.getDate()}`; }
function dayName(d){ return ['日','一','二','三','四','五','六'][d.getDay()]; }

// ══ 服事定義（與後台相同） ══
const SERVICES = [
  { id:'prayer', name:'禱告會',  color:'#58a6ff', cls:'prayer', weekday:4, time:'19:30–21:00', gather:'18:30–19:00' },
  { id:'theone', name:'THE ONE', color:'#bc8cff', cls:'theone', weekday:6, time:'18:30–20:00', gather:'16:30' },
  { id:'sun',    name:'美河主日', color:'#e3b341', cls:'sun',    weekday:0, time:'9:00–12:30',  gather:'7:30' },
];

function getWeeks(y,m){
  const weeks=[];let d=new Date(y,m-1,1);
  while(d.getMonth()===m-1){
    if(d.getDay()===4){
      const thu=new Date(d);
      const sat=new Date(d);sat.setDate(sat.getDate()+2);
      const sun=new Date(d);sun.setDate(sun.getDate()+3);
      weeks.push({thu,sat,sun});
    }
    d.setDate(d.getDate()+1);
  }
  return weeks;
}

function getSvcDate(week,svc){
  if(svc.weekday===4) return week.thu;
  if(svc.weekday===6) return week.sat;
  return week.sun;
}

const weeks = getWeeks(year, month);

// ══ 渲染日期清單 ══
function renderDateList(){
  const list = document.getElementById('date-list');
  list.innerHTML = '';
  weeks.forEach((week, wi) => {
    const wkHdr = document.createElement('div');
    wkHdr.className = 'week-hdr week-sep';
    wkHdr.textContent = `第${['一','二','三','四','五'][wi]}週`;
    list.appendChild(wkHdr);

    SERVICES.forEach(svc => {
      const date = getSvcDate(week, svc);
      const ds = fmtDate(date);
      const item = document.createElement('label');
      item.className = 'date-item';
      item.dataset.ds = ds;
      item.innerHTML = `
        <input type="checkbox" value="${ds}">
        <div class="custom-cb"></div>
        <div class="date-info">
          <div class="date-svc ${svc.cls}">
            <span>${svc.name}</span>　${mmdd(date)}（${dayName(date)}）
          </div>
          <div class="date-detail">⏰ ${svc.time}　🕐 集合 ${svc.gather}</div>
        </div>`;
      item.addEventListener('change', function(){
        item.classList.toggle('checked', item.querySelector('input').checked);
      });
      list.appendChild(item);
    });
  });
}

// ══ 載入同工姓名 ══
async function loadMembers(){
  const snap = await db.ref('public/memberNames').get();
  const names = snap.exists() ? snap.val() : [];
  const sel = document.getElementById('name-select');
  (Array.isArray(names) ? names : Object.values(names)).sort().forEach(name => {
    const opt = document.createElement('option');
    opt.value = name;
    opt.textContent = name;
    sel.appendChild(opt);
  });
}

// ══ 檢查是否已填寫過 ══
async function checkAlreadySubmitted(name){
  const safeName = name.replace(/[^\u4e00-\u9fa5a-zA-Z0-9]/g,'_');
  const snap = await db.ref(`memberAvailability/${year}-${pad(month)}/${safeName}`).get();
  if(snap.exists()){
    document.getElementById('already-note').style.display='block';
    // Pre-check already submitted dates
    const data = snap.val();
    if(data && data.dates){
      document.querySelectorAll('.date-item').forEach(item => {
        const ds = item.dataset.ds;
        const cb = item.querySelector('input');
        if(data.dates.includes(ds)){
          cb.checked = true;
          item.classList.add('checked');
        }
      });
    }
  } else {
    document.getElementById('already-note').style.display='none';
  }
}

document.getElementById('name-select').addEventListener('change', function(){
  // Reset all checkboxes
  document.querySelectorAll('.date-item').forEach(item => {
    item.querySelector('input').checked = false;
    item.classList.remove('checked');
  });
  document.getElementById('already-note').style.display='none';
  if(this.value) checkAlreadySubmitted(this.value);
});

// ══ 清除所有勾選 ══
function clearAllChecks(){
  document.querySelectorAll('.date-item').forEach(item => {
    item.querySelector('input').checked = false;
    item.classList.remove('checked');
  });
}

// ══ 送出 ══
async function submitForm(){
  const name = document.getElementById('name-select').value.trim();
  const errEl = document.getElementById('err-msg');
  errEl.style.display='none';

  if(!name){
    errEl.textContent='請先選擇你的名字！';errEl.style.display='block';return;
  }

  const unavailDates = [];
  document.querySelectorAll('.date-item input:checked').forEach(cb => {
    unavailDates.push(cb.value);
  });

  const btn = document.getElementById('submit-btn');
  btn.disabled = true; btn.textContent = '送出中…';

  try{
    const safeName = name.replace(/[^\u4e00-\u9fa5a-zA-Z0-9]/g,'_');
    await db.ref(`memberAvailability/${year}-${pad(month)}/${safeName}`).set({
      name:         name,
      dates:        unavailDates,
      submittedAt:  new Date().toISOString(),
      month:        `${year}-${pad(month)}`,
    });

    const totalSvc = weeks.length * SERVICES.length;
    const unavailCount = unavailDates.length;
    const availCount = totalSvc - unavailCount;
    document.getElementById('success-detail').innerHTML =
      `<strong>${name}</strong> — ${year}年${month}月<br>` +
      (unavailCount === 0
        ? '全月均可服事 🎉'
        : `無法服事：<strong style="color:var(--red)">${unavailCount}</strong> 場次｜可服事：<strong style="color:var(--green)">${availCount}</strong> 場次`);

    document.getElementById('form-screen').style.display='none';
    document.getElementById('success-screen').style.display='block';
  } catch(e){
    errEl.textContent='送出失敗，請確認網路連線後重試：'+e.message;
    errEl.style.display='block';
    btn.disabled=false;btn.textContent='送出';
  }
}

function showForm(){
  document.getElementById('form-screen').style.display='block';
  document.getElementById('success-screen').style.display='none';
  document.getElementById('submit-btn').disabled=false;
  document.getElementById('submit-btn').textContent='送出';
  clearAllChecks();
  document.getElementById('name-select').value='';
  document.getElementById('already-note').style.display='none';
}

// ══ 初始化 ══
async function init(){
  document.getElementById('hdr-month').textContent =
    `${year}年${month}月 服事可用時間填寫`;

  renderDateList();
  await loadMembers();

  document.getElementById('loading-screen').style.display='none';
  document.getElementById('form-screen').style.display='block';
}

init().catch(e => {
  document.getElementById('loading-screen').innerHTML =
    `<div style="color:#f85149;padding:30px;text-align:center">
      無法連線，請重新整理頁面。<br><small>${e.message}</small>
    </div>`;
});
</script>
</body>
</html>
